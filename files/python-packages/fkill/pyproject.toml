[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fkill"
version = "1.0.0"
description = "Fuzzy process killer (ps | fzf, SIGTERM/SIGKILL)."
requires-python = ">=3.10"
license = "Apache-2.0"

[project.scripts]
fkill = "fkill:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["fkill"]
