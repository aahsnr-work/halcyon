# Homebrew environment for systemd user sessions, Wayland compositors, and GUI apps.
#
# /etc/profile.d/brew.sh (from the Bazzite base, ublue-os/brew) only fires for
# interactive shells ([[ $- == *i* ]]).  The systemd --user instance, Hyprland,
# Noctalia and apps launched from the desktop inherit a PAM/systemd environment
# that does NOT source profile.d.  This file is picked up by
# systemd-environment-d-generator and injects the brew bin dirs into every user
# session's environment unconditionally — making installed brew packages available
# immediately after first login without requiring a new shell.
#
# Brew bin dirs are appended (not prepended) to preserve system-binary priority,
# consistent with the upstream ublue-os/brew design decision.
PATH=$PATH:/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin
HOMEBREW_PREFIX=/home/linuxbrew/.linuxbrew
HOMEBREW_CELLAR=/home/linuxbrew/.linuxbrew/Cellar
HOMEBREW_REPOSITORY=/home/linuxbrew/.linuxbrew/Homebrew
