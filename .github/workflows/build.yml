name: build
on:
  schedule:
    - cron: "00 08 * * *"
  push:
    branches: [container, main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  build:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # Copr's download CDN intermittently 504s on repodata; poll until every
      # consumed COPR answers 200 (up to ~30 min) — consumed during the
      # transition (Hyprland/zen/desktop) AND for the p03 kernel (Stage K1).
      - name: Wait for Copr metadata availability
        run: |
          set -euo pipefail
          URLS=(
            "https://download.copr.fedorainfracloud.org/results/lionheartp/Hyprland/fedora-44-x86_64/repodata/repomd.xml"
            "https://download.copr.fedorainfracloud.org/results/catpieleaf/kernel-p03/fedora-44-x86_64/repodata/repomd.xml"
          )
          for i in $(seq 1 30); do
            ok=1
            for URL in "${URLS[@]}"; do
              code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || true)
              echo "attempt ${i}: HTTP ${code}  ${URL}"
              [ "$code" = "200" ] || ok=0
            done
            [ "$ok" = "1" ] && exit 0
            sleep 60
          done
          echo "::error::Copr metadata still unavailable after 30 attempts — re-run later."
          exit 1

      - uses: actions/checkout@v4

      # free runner disk (equivalent of the action's maximize_build_space)
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/lib/jvm /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Build image
        id: build
        run: |
          set -euo pipefail
          DATE_TAG=$(date +%Y%m%d)
          SHA_TAG=$(git rev-parse --short HEAD)
          IMAGE=ghcr.io/${{ github.repository_owner }}/halcyon
          # OCI labels consume IMAGE_VERSION (<fedora>.<yyyymmdd>, bazzite
          # convention) and SOURCE_SHA (git revision) via Containerfile ARGs
          podman build --pull --platform linux/amd64 \
            --build-arg IMAGE_VERSION=44.${DATE_TAG} \
            --build-arg SOURCE_SHA=$(git rev-parse HEAD) \
            -t ${IMAGE}:latest -t ${IMAGE}:${DATE_TAG} \
            -t ${IMAGE}:44 -t ${IMAGE}:${DATE_TAG}-44 -t ${IMAGE}:${SHA_TAG}-44 .
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "date_tag=${DATE_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"

      # Distinctive package-count report: run the freshly built image and
      # write the census into the run summary (GITHUB_STEP_SUMMARY) plus a
      # ::notice:: annotation. The census is also baked into the image at
      # /usr/share/halcyon/package-count by build_files/final-verify.
      - name: Package count report
        run: |
          set -euo pipefail
          IMAGE="${{ steps.build.outputs.image }}:latest"
          INFO=$(podman run --rm --entrypoint /bin/bash "$IMAGE" -c \
            'echo "count=$(rpm -qa | wc -l)"; echo "kernel=$(rpm -q --qf "%{VERSION}-%{RELEASE}.%{ARCH}" kernel-p03 2>/dev/null || echo n/a)"')
          COUNT=$(sed -n 's/^count=//p' <<< "$INFO")
          KVER=$(sed -n 's/^kernel=//p' <<< "$INFO")
          {
            echo "## 📦 halcyon image package report"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| **Total installed RPM packages** | **${COUNT}** |"
            echo "| p03 kernel | ${KVER} |"
            echo "| Source | \`${{ steps.build.outputs.image }}:${{ steps.build.outputs.sha_tag }}-44\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=halcyon package count::${COUNT} RPMs installed (p03 kernel ${KVER})"
          echo "  total installed RPM packages: ${COUNT}"
          echo "  p03 kernel: ${KVER}"

      # sign + push only on branch pushes (not PRs) — same semantics as the
      # BlueBuild action had
      - name: Login to GHCR
        if: github.event_name == 'push'
        run: echo "${{ github.token }}" | \
          podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3

      - name: Sign and push
        if: github.event_name == 'push'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
        run: |
          set -euo pipefail
          IMAGE="${{ steps.build.outputs.image }}"
          for tag in latest "${{ steps.build.outputs.date_tag }}" 44 \
                     "${{ steps.build.outputs.date_tag }}-44" "${{ steps.build.outputs.sha_tag }}-44"; do
            podman push "${IMAGE}:${tag}"
            cosign sign --key env://COSIGN_PRIVATE_KEY --yes "${IMAGE}:${tag}"
          done
