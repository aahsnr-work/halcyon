---
name: clean
# GHCR housekeeping modeled on aurora/bluefin's clean.yml: prune image
# versions older than 90 days (keeping the newest 7 tagged) and orphaned
# untagged layers, so the ghcr.io/aahsnr-work/halcyon package does not grow
# without bound from the daily scheduled builds.
on:
  schedule:
    - cron: "15 0 * * 0" # 0015 UTC on Sundays
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}

jobs:
  delete-older-than-90:
    name: Prune old GHCR versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: Delete Images Older Than 90 Days
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: halcyon
          older-than: 90 days
          delete-orphaned-images: true
          keep-n-tagged: 7
          keep-n-untagged: 7
