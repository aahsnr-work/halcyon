---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# branding.yml — os-release identity + plymouth/motd/backgrounds placeholders.
# Plymouth theme files, motd text and wallpapers are TODO(user) assets (§7.7);
# no invented logos/wallpapers — fallback to spinner until real assets land.
modules:
  - type: os-release
    properties:
      NAME: halcyon
      PRETTY_NAME: halcyon (Bazzite fork)
      HOME_URL: https://github.com/aahsnr-work/halcyon
      # ID/ID_LIKE intentionally untouched (fedora-compatible; §1.19k)

  - type: script@v1
    scripts:
      - branding-verify.sh
