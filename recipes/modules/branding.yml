---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# branding.yml — os-release identity + Plymouth/MOTD/backgrounds.
# The halcyon Plymouth theme (two-step, background shipped) is set as the
# default by branding-verify.sh; the initramfs module below regenerates
# afterwards so the themed splash is active in early boot (and covers the
# P03 kernel from p03-kernel.yml).
modules:
  - type: os-release
    properties:
      NAME: halcyon
      PRETTY_NAME: halcyon (Bazzite fork)
      HOME_URL: https://github.com/aahsnr-work/halcyon
      # ID/ID_LIKE intentionally untouched (fedora-compatible; §1.19k)

  - type: script
    scripts:
      - branding-verify.sh

  # Regenerate the initramfs AFTER the halcyon theme is set (early-boot
  # splash) and AFTER the P03 kernel swap (p03-kernel.yml) so the new
  # kernel boots with the themed splash.
  - type: initramfs
