---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# services.yml — systemd enable/mask (AFTER build-scripts.yml so pyprland.service exists).
modules:
  - type: systemd
    system:
      enabled:
        - greetd.service
      masked:
        - sddm.service
        - gdm.service
        - bazzite-autologin.service
        - nvidia-persistenced.service
        - nvidia-powerd.service
    user:
      enabled:
        - pyprland.service
        - brew-bundle.service
