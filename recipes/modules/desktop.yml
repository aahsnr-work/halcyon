---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# desktop.yml — Hyprland + Noctalia + greetd.
# UNSCOPED installs only (§1.21 --repoid trap): plain package names, deps
# resolve from fedora+updates+COPR together; provenance verified afterwards.
# NOTE: Fedora's binary package is `tuigreet` (source package greetd-tuigreet),
# not `greetd-tuigreet` — verified against F43/F44 mirrors 2026-09-17.
# greetd config ships as files/system/etc/greetd/config.toml (§7.1) — user
# "greetd" (Fedora packaging fact §1.18). tuigreet has NO --cache flag
# (verified against 0.9.1 + 0.11.x source 2026-09-17): /var/cache/tuigreet is
# its hardcoded cache dir, created by the tuigreet-cache.conf tmpfiles drop-in
# (§7.2). No user-level Hyprland config baked (Noctalia first-run wizard +
# chezmoi dots own ~/.config/hypr).
#
# TODO(user): optional COPR extras from lionheartp/Hyprland (per §1.15):
#   hyprshot, hypridle, hyprlock, hyprpaper, cliphist, kitty, waybar-git,
#   matugen, uwsm, noctalia-greeter-git, nwg-look, qt6ct — add as PLAIN package
#   names to the dnf install list above (never repo:-scoped, §1.21).
#
# sched_ext: nothing to install (§1.4) — scx-scheds/scx-tools + steamos-manager
# are already in the base; see README (scxctl / scx_loader + BORE caveat).
modules:
  - type: dnf
    repos:
      cleanup: true                      # disables the COPR after install; file purged below
      copr:
        - lionheartp/Hyprland
    install:
      install-weak-deps: false
      skip-unavailable: true
      packages:                          # PLAIN names — deps resolve from fedora+updates+COPR
        - hyprland-git                   # only in lionheartp COPR
        - noctalia-git                   # only in lionheartp COPR
        - hyprpolkitagent
        - hyprland-qt-support
        - greetd
        - tuigreet                       # Fedora binary pkg name (src pkg: greetd-tuigreet)
        - xdg-desktop-portal-hyprland
        - xdg-desktop-portal-gtk
        - qt6-qtwayland

  - type: script@v1
    scripts:
      - desktop-verify.sh        # COPR file purge + provenance/ABI/repo gates
