---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# build-scripts.yml — the four build-time installers (files/scripts/*.sh),
# baked results. TeX Live (scheme-medium) adds multi-GB build traffic and
# image weight — intended; EXTRA_TL_PACKAGES=(latexmk biber) kept as scripted.
modules:
  - type: dnf
    install:
      install-weak-deps: false
      skip-unavailable: true
      packages:
        - gcc        # KEPT — emacs-pgtk (native-comp) Requires gcc at runtime; removing it
                     # cascades into removing emacs-pgtk (NOTES.md §4 deviation S). It is
                     # pulled in as an emacs-pgtk dependency in apps.yml anyway; also used
                     # by install-pyprland.sh's optional C helper.
        - perl       # tlmgr — NOT in base (Containerfile audit); KEPT for runtime tlmgr
        - jq         # install-obsidian.sh / install-pyprland.sh — base presence unconfirmed; KEPT (tiny)
        - python3    # venv base (python3-pip IS in base → likely present; idempotent)

  - type: script@v1
    scripts:           # official mechanism: executes files/scripts/*.sh ($CONFIG_DIRECTORY/scripts)
      - install-obsidian.sh
      - install-zotero.sh
      - install-pyprland.sh
      - install-texlive.sh

  - type: script@v1
    scripts:
      - build-scripts-verify.sh
